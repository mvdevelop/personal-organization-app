name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
        with:
          # Exclude node_modules from checkout (shouldn't be in repo)
          filter: blob:none

      # === Backend ===
      - name: Setup Node.js 22 (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Type-check backend
        run: cd backend && npx tsc --noEmit
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-key-for-ci-min-32-characters
          NODE_ENV: test

      - name: Lint backend
        run: cd backend && npx tsc --noEmit

      - name: Test backend
        run: cd backend && npm run test:ci
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-key-for-ci-min-32-characters
          NODE_ENV: test

      # === Frontend ===
      - name: Setup Node.js 22 (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Type-check frontend
        run: cd frontend && npx tsc -b --noEmit

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Build frontend
        run: cd frontend && npm run build

      # === Security Audit ===
      # Fail the build if high-severity vulnerabilities are found
      - name: Audit backend dependencies
        run: cd backend && npm audit --audit-level=high

      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=high

      # === CodeQL Security Scan ===
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          # Upload results to Security tab even if there are alerts
          upload: true
          category: "code-scanning-threat"
