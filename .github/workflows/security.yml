name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan
    - cron: '0 3 * * 1'

jobs:
  # === SAST: Static Analysis ===
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep
        run: semgrep scan --config p/ci --error --sarif --output semgrep.sarif

      - name: Upload Semgrep report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # === Dependency Scanning ===
  dependency-graph:
    name: Dependency Graph
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run npm audit
        run: |
          cd backend && npm audit --audit-level=moderate || true
          cd ../frontend && npm audit --audit-level=moderate || true

  # === DAST: Dynamic Analysis (OWASP ZAP) ===
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start backend
        run: |
          cd backend
          npm ci
          npm run build
          MONGODB_URI=mongodb://localhost:27017/test \
          JWT_SECRET=test-secret-for-dast-scan \
          NODE_ENV=production \
          npx tsx src/server.ts &
          sleep 5
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-for-dast-scan
          NODE_ENV: production

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --network host --user 0 \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3001/api \
            -r zap-report.html \
            -J zap-report.json \
            -a || test -f zap-report.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.json

      - name: Upload ZAP SARIF when available
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('zap-report.sarif') != ''
        with:
          sarif_file: zap-report.sarif

