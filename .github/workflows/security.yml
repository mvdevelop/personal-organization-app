name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan
    - cron: '0 3 * * 1'

jobs:
  # === SAST: Static Analysis ===
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep
        # Findings are uploaded to code scanning; they should not prevent the
        # dependency and DAST jobs from producing their reports.
        run: semgrep scan --config p/ci --sarif --output semgrep.sarif || true

      - name: Upload Semgrep report
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep-ci
          wait-for-processing: true

  # === Dependency Scanning ===
  dependency-graph:
    name: Dependency Graph
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run npm audit
        run: |
          cd backend && npm audit --audit-level=moderate || true
          cd ../frontend && npm audit --audit-level=moderate || true

  # === DAST: Dynamic Analysis (OWASP ZAP) ===
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Start backend
        working-directory: backend
        run: |
          npm run build
          MONGODB_URI=mongodb://localhost:27017/test \
          JWT_SECRET=test-secret-for-dast-scan-minimum-32-characters \
          NODE_ENV=production \
          node dist/server.js > ../backend-dast.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../backend-dast.log
          exit 1
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-for-dast-scan
          NODE_ENV: production

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --network host --user 0 \
            -v "${{ github.workspace }}:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3001/api \
            -r zap-report.html \
            -J zap-report.json \
            -a || test -f zap-report.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
          compression-level: 6
          include-hidden-files: false

      - name: Upload ZAP SARIF when available
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('zap-report.sarif') != ''
        with:
          sarif_file: zap-report.sarif

